spring:
  application:
    name: nexdeals-backend
  profiles:
    active: dev
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=5m

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

nexdeals:
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-in-production-please-32chars!!}
    expiration-ms: 86400000
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
  steam:
    api-key: ${STEAM_API_KEY:}
  epic:
    enabled: ${EPIC_ENABLED:true}
  ai:
    openai-api-key: ${OPENAI_API_KEY:}
    openai-model: ${OPENAI_MODEL:gpt-4o-mini}